services:
  # ----------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # ----------------------------------------------------
  - type: web
    name: lms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://lms-frontend.onrender.com,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
      - key: PYTHON_VERSION
        value: 3.11.9

  # ----------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------
  - type: static
    name: lms-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lms-backend.onrender.com/api

# ------------------------------------------------------
# 3. Managed PostgreSQL Database
# ------------------------------------------------------
databases:
  - name: lms-db
    databaseName: lms_production
    user: lms_user
    plan: free
