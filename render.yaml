services:
  # Backend Web Service (FastAPI)
  - type: web
    name: lms-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python -m backend.seed
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # Frontend Static Site (Vite)
  - type: web
    name: lms-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lms-backend
          property: host
